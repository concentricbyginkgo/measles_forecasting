name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install neuralprophet scikit-learn statsmodels pandas numpy \
            geopandas multiprocess matplotlib scipy country_converter seaborn \
            xgboost catboost lightgbm ordpy statsforecast
      
      - name: Test Python imports and syntax
        run: |
          python test/test_python_imports.py
      
      - name: Test file structure
        run: |
          python test/test_file_structure.py

  r-tests:
    name: R Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'
      
      - name: Install R dependencies
        run: |
          Rscript -e "install.packages(c('data.table', 'parallel', 'lubridate', 'countrycode'), repos = 'https://cloud.r-project.org')"
      
      - name: Test R script syntax
        run: |
          Rscript test/test_r_syntax.R
      
      - name: Test compilation scripts
        run: |
          Rscript test/test_compilation_scripts.R

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [python-tests, r-tests]
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install neuralprophet scikit-learn statsmodels pandas numpy \
            geopandas multiprocess matplotlib scipy country_converter seaborn \
            xgboost catboost lightgbm ordpy statsforecast
          Rscript -e "install.packages(c('data.table', 'parallel', 'lubridate', 'countrycode'), repos = 'https://cloud.r-project.org')"
      
      - name: Run all tests
        run: |
          chmod +x test/run_all_tests.sh
          test/run_all_tests.sh
